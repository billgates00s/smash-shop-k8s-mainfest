apiVersion: v1
kind: Service
metadata:
  name: smashshop-backend-service
  namespace: application-deployment
spec:
  type: NodePort
  selector:
    app: smashshop-backend
  ports:
    - name: http           # Thêm tên cho port d?u tiên
      protocol: TCP
      port: 80
      targetPort: 5001
      nodePort: 30003
    - name: https           # Thêm tên cho port d?u tiên
      protocol: TCP
      port: 443
      targetPort: 5443
      nodePort: 30449
