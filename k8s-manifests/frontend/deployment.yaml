apiVersion: apps/v1
kind: Deployment
metadata:
  name: smashshop-frontend-deployment
  namespace: application-deployment
  labels:
    app: smashshop-frontend
spec:
  replicas: 2
  # Chiến lược cập nhật giúp ứng dụng không bị gián đoạn khi deploy bản mới
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: smashshop-frontend
  template:
    metadata:
      labels:
        app: smashshop-frontend
    spec:
      containers:
        - name: smashshop-frontend
          image: nhannh/smash-shop-frontend-image:51
          # Luôn luôn quy định tài nguyên để tránh Pod chiếm hết RAM của Node
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443

          # Kiểm tra xem Nginx đã khởi động xong chưa
          livenessProbe:
            httpGet:
              path: /
              port: 30444
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20

          # Kiểm tra xem Pod đã sẵn sàng nhận traffic chưa
          readinessProbe:
            httpGet:
              path: /
              port: 30444
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10

          envFrom:
            - secretRef:
                name: smashshop-frontend-secret
          env:
            - name: REACT_APP_API_URL
              value: "https://192.168.13.128:30444" # Nên điền URL cụ thể thay vì để trống

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: ssl-certs
              mountPath: /etc/nginx/ssl/smashshop.com
              readOnly: true

      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
            items:
              - key: default.conf
                path: default.conf
        - name: ssl-certs
          secret:
            secretName: frontend-tls-secret
            items:
              - key: tls.crt
                path: smashshop.com.crt
              - key: tls.key
                path: smashshop.com.key