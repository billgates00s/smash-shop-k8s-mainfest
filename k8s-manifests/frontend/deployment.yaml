apiVersion: apps/v1
kind: Deployment
metadata:
  name: smashshop-frontend-deployment
  namespace: application-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smashshop-frontend
  template:
    metadata:
      labels:
        app: smashshop-frontend
    spec:
      containers:
      - name: smashshop-frontend
        image: nhannh/smash-shop-frontend-image:44
        ports:
        - containerPort: 80
        - containerPort: 443
        envFrom:
        - secretRef:
            name: smashshop-frontend-secret
        env:
        - name: REACT_APP_API_URL
          value: ""
        # --- PH?N THÊM M?I 1: G?n file vào thu m?c bên trong Container ---
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf  # Ch? ghi dè dúng file default.conf
        - name: ssl-certs
          mountPath: /etc/nginx/ssl
          readOnly: true
      # --- PH?N THÊM M?I 2: Ð?nh nghia ngu?n d? li?u cho Volume ---
      volumes:
      - name: nginx-config
        configMap:
          name: frontend-nginx-config # Tên ConfigMap ch?a n?i dung file default.conf
      - name: ssl-certs
        secret:
         secretName: frontend-tls-secret # Tên Secret ch?a file .crt và .key
