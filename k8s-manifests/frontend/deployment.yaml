apiVersion: apps/v1
kind: Deployment
metadata:
  name: smashshop-frontend-deployment
  namespace: application-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smashshop-frontend
  template:
    metadata:
      labels:
        app: smashshop-frontend
    spec:
      containers:
        - name: smashshop-frontend
          image: nhannh/smash-shop-frontend-image:48
          ports:
            - containerPort: 80
            - containerPort: 443
          envFrom:
            - secretRef:
                name: smashshop-frontend-secret
          env:
            - name: REACT_APP_API_URL
              value: "http://192.168.13.128:30003"
          volumeMounts:
            # Mount file config Nginx
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            # Mount chứng chỉ SSL vào đúng thư mục Nginx mong đợi
            - name: ssl-certs
              mountPath: /etc/nginx/ssl/smashshop.com
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
        - name: ssl-certs
          secret:
            secretName: frontend-tls-secret
            # Ánh xạ tên file trong Secret (tls.crt/tls.key) thành tên file bạn muốn
            items:
              - key: tls.crt
                path: smashshop.com.crt
              - key: tls.key
                path: smashshop.com.key