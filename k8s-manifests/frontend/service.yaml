apiVersion: v1
kind: Service
metadata:
  name: smashshop-frontend-service
  namespace: application-deployment
spec:
  type: NodePort
  selector:
    app: smashshop-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30002
    - name: https          # Thêm tên cho port th? hai
      protocol: TCP
      port: 443
      targetPort: 443
      nodePort: 30444